name: minecraft-zfs-agent
services:
  agent:
    image: minecraft-zfs-agent:local
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, DAC_OVERRIDE, CHOWN, FOWNER, FSETID]
    security_opt: [no-new-privileges:true]
    devices: [/dev/zfs:/dev/zfs:rwm]
    pids_limit: 64
    stop_grace_period: 45s
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    networks:
      minecraft:
        aliases: [minecraft-zfs-agent]
    volumes:
      - type: bind
        source: ${AGENT_CONFIG:?Set absolute private agent configuration file}
        target: /etc/minecraft-zfs-agent.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WORLD_PATH:?Set exact dedicated world mount path}
        target: ${WORLD_PATH:?Set exact dedicated world mount path}
        read_only: ${WORLD_READ_ONLY:-false}
        bind: {create_host_path: false}
      - type: bind
        source: ${STATE_DIR:?Set private HTTP state directory}
        target: ${STATE_DIR:?Set private HTTP state directory}
        bind: {create_host_path: false}
      - type: bind
        source: ${SECRETS_DIR:?Set private directory containing API and optional Crafty tokens}
        target: ${SECRETS_DIR:?Set private directory containing API and optional Crafty tokens}
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, /usr/bin/python3, -c, "import urllib.request; from minecraft_zfs_agent.config import Config; c=Config.load('/etc/minecraft-zfs-agent.json'); urllib.request.urlopen('http://127.0.0.1:'+str(c.listen_port)+'/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
networks:
  minecraft:
    external: true
    name: ${AGENT_NETWORK:?Set existing private Docker network shared with Crafty}
